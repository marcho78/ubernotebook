  <g fill="#0b0f1d">
    <circle cx="31.5" cy="19" r="2.6"/><circle cx="31.5" cy="33" r="2.6"/><circle cx="31.5" cy="47" r="2.6"/>
    <circle cx="31.5" cy="61" r="2.6"/><circle cx="31.5" cy="75" r="2.6"/><circle cx="31.5" cy="89" r="2.6"/>
    <circle cx="31.5" cy="103" r="2.6"/>
