    <g stroke="url(#wire)" stroke-width="4">
      <path d="M31 18 C21 14 12 17 12 22"/><path d="M31 32 C21 28 12 31 12 36"/><path d="M31 46 C21 42 12 45 12 50"/>
      <path d="M31 60 C21 56 12 59 12 64"/><path d="M31 74 C21 70 12 73 12 78"/><path d="M31 88 C21 84 12 87 12 92"/>
      <path d="M31 102 C21 98 12 101 12 106"/>
