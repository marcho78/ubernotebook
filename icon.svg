  <rect x="40" y="32" width="46" height="26" rx="6" fill="#f6efdf"/>
  <path d="M47 42 H79 M47 49 H70" stroke="#8d9ab8" stroke-width="3" stroke-linecap="round"/>
  <!-- the elastic band -->
  <rect x="91" y="6" width="7" height="110" rx="2" fill="url(#band)"/>
  <!-- the spiral -->
  <g fill="none" stroke-linecap="round">
