  <rect x="22" y="8" width="82" height="106" rx="10" fill="url(#cover)"/>
  <rect x="26.5" y="12.5" width="73" height="97" rx="7" fill="none" stroke="#e8d9a8" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="4 3"/>
