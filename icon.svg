<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34497a"/>
      <stop offset="1" stop-color="#1c2747"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6f8"/>
      <stop offset="1" stop-color="#8a929c"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f1528"/>
      <stop offset="0.4" stop-color="#2a3558"/>
      <stop offset="1" stop-color="#121a33"/>
    </linearGradient>
  </defs>
  <!-- the pages, showing at the edge -->
  <rect x="31" y="15" width="82" height="104" rx="9" fill="#d9ceb4"/>
  <rect x="28" y="12" width="82" height="104" rx="9" fill="#f6efdf"/>
